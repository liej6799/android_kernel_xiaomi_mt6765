name: Build Base MT6765 Kernel

on:
  workflow_dispatch:
  push:
    branches: [lineage-17.1]
    paths:
      - '.github/workflows/base-build.yml'
      - 'arch/arm/configs/cactus_defconfig'
      - 'arch/arm/configs/cereus_defconfig'
      - 'tools/dct/**'
      - 'net/Makefile'

permissions:
  contents: write

env:
  WMT_TAG: MMI-W3WYS36.54-12-5-1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        device: [cereus, cactus]

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: kernel

      - name: Checkout MediaTek connectivity module sources (wmt_drv/wlan gen4m)
        run: |
          VENDOR=vendor/mediatek/kernel_modules/connectivity
          mkdir -p "$VENDOR/wlan/core"
          git clone --depth 1 --branch "$WMT_TAG" \
            https://github.com/MotorolaMobilityLLC/vendor-mediatek-kernel_modules-connectivity-common \
            "$VENDOR/common"
          git clone --depth 1 --branch "$WMT_TAG" \
            https://github.com/MotorolaMobilityLLC/vendor-mediatek-kernel_modules-connectivity-wlan-adaptor \
            "$VENDOR/wlan/adaptor"
          git clone --depth 1 --branch "$WMT_TAG" \
            https://github.com/MotorolaMobilityLLC/vendor-mediatek-kernel_modules-connectivity-wlan-core-gen4m \
            "$VENDOR/wlan/core/gen4m"
          # Pre-create the symlinks the kernel Makefile expects (its own
          # $(shell ln -s ...) runs with an unset srctree in CI)
          cd kernel/drivers/misc/mediatek/connectivity
          ln -sfn "$GITHUB_WORKSPACE/$VENDOR/common" wmt_drv
          ln -sfn "$GITHUB_WORKSPACE/$VENDOR/wlan/adaptor" wmt_chrdev_wifi
          ln -sfn "$GITHUB_WORKSPACE/$VENDOR/wlan/core/gen4m" wlan_drv_gen4m
          ls -la

      - name: Patch vendor sources for built-in compile
        run: |
          V="$GITHUB_WORKSPACE/vendor/mediatek/kernel_modules/connectivity"
          # enable the built-in switch in wmt_drv's own Kbuild
          sed -i 's|^#ccflags-y += -D MTK_WCN_REMOVE_KERNEL_MODULE|ccflags-y += -D MTK_WCN_REMOVE_KERNEL_MODULE|' \
            "$V/common/Kbuild"
          # drop -Werror (AOSP GCC 4.9 false positives, e.g. {0} initializers)
          sed -i 's|^ccflags-y += -Werror |ccflags-y += |' \
            "$V/common/Kbuild" \
            "$V/wlan/core/gen4m/Makefile"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev cpio zip unzip python-is-python3

      - name: Cache GCC 4.9 toolchain
        uses: actions/cache@v4
        with:
          path: ~/gcc49
          key: mt6765-gcc49-lineage-v2

      - name: Setup GCC 4.9 toolchain (LineageOS mirror)
        run: |
          set -e
          if [ ! -x "$HOME/gcc49/bin/arm-linux-androideabi-gcc" ]; then
            rm -rf "$HOME/gcc49"
            git clone --depth 1 \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
              "$HOME/gcc49"
          fi
          echo "$HOME/gcc49/bin" >> "$GITHUB_PATH"
          arm-linux-androideabi-gcc --version 2>&1 | head -1

      - name: Build kernel (with built-in WMT/WLAN)
        working-directory: kernel
        env:
          TOP: ${{ github.workspace }}
        run: |
          make O=out ARCH=arm CROSS_COMPILE="$HOME/gcc49/bin/arm-linux-androideabi-" \
               ${{ matrix.device }}_defconfig
          make -j"$(nproc)" O=out ARCH=arm \
               KCFLAGS="-Wno-error -DMTK_WCN_REMOVE_KERNEL_MODULE -DMTK_WCN_BUILT_IN_DRIVER" \
               CROSS_COMPILE="$HOME/gcc49/bin/arm-linux-androideabi-"
          ls -la out/arch/arm/boot/zImage
          grep -E "UTS_VERSION|LINUX_COMPILER" out/include/generated/compile.h

      - name: Package AnyKernel3 zip
        working-directory: kernel
        run: |
          DATE=$(date -u +%Y%m%d)
          ZIPNAME="mt6765-${{ matrix.device }}-base-${DATE}.zip"
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README*
          cp out/arch/arm/boot/zImage ak3/zImage
          sed -i 's|^kernel.string=.*|kernel.string=MT6765-${{ matrix.device }} base|' ak3/anykernel.sh
          sed -i 's|^do.devicecheck=1|do.devicecheck=0|' ak3/anykernel.sh
          python3 - <<'EOF'
          import re
          p = 'ak3/anykernel.sh'
          s = open(p).read()
          s = re.sub(r'^BLOCK=.*$',
                     'BLOCK=$(find /dev/block -name boot 2>/dev/null | head -n1); [ -z "$BLOCK" ] && BLOCK=/dev/block/by-name/boot;',
                     s, flags=re.M)
          s = re.sub(r'# boot install.*$',
                     '# boot install\ndump_boot;\nwrite_boot;\n',
                     s, flags=re.S)
          open(p, 'w').write(s)
          EOF
          sh -n ak3/anykernel.sh && echo "anykernel.sh syntax OK"
          (cd ak3 && zip -qr9 "../${ZIPNAME}" .)
          sha256sum "${ZIPNAME}" > "sha256-${{ matrix.device }}.txt"
          cp "${ZIPNAME}" "sha256-${{ matrix.device }}.txt" ..
          echo "ZIPNAME=${ZIPNAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: ${{ env.ZIPNAME }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: base-${{ matrix.device }}-${{ github.run_number }}
          name: ${{ env.ZIPNAME }}
          body: |
            DroidSpaces build for ${{ matrix.device }} with built-in WMT + WLAN gen4m (CONNAC).

            - Source: ${{ github.sha }}
            - Toolchain: AOSP arm-linux-androideabi GCC 4.9
            - Vendor connectivity: Motorola OSS drop ${{ env.WMT_TAG }}
          files: |
            ${{ env.ZIPNAME }}
            sha256-${{ matrix.device }}.txt
